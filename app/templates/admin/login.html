<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Painel | BIOZON</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body style="background-color: #07132b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; font-family: sans-serif;">
  <div style="background: #ffffff; width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="color: #0f172a; font-weight: 900; font-size: 1.8rem; margin-bottom: 0.25rem;">BIOZON</h2>
      <p style="color: #64748b; font-size: 0.9rem; font-weight: 600;">Painel de Gestão Técnica</p>
    </div>

    {% if error %}
    <div style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700; margin-bottom: 1.5rem; text-align: center;">
      {{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-weight: 800; font-size: 0.85rem; color: #0f172a; margin-bottom: 0.4rem;">Usuário</label>
        <input type="text" name="username" required placeholder="Digite seu usuário" style="width: 100%; padding: 0.75rem; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 1.75rem;">
        <label style="display: block; font-weight: 800; font-size: 0.85rem; color: #0f172a; margin-bottom: 0.4rem;">Senha</label>
        <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; box-sizing: border-box;">
      </div>

      <button type="submit" style="width: 100%; background: #0284c7; color: #ffffff; padding: 0.85rem; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer;">
        Entrar no Sistema
      </button>
    </form>
  </div>
</body>
</html>
